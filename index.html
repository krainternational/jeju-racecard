왔습니다.`,rankTab:"나만의 순위",modelP:"모델 승률",fnames:{dist:"거리 적성",form:"최근 폼",hwin:"말 승률",jock:"기수 승률",trn:"조교사 승률",ratg:"레이팅"},rankNote:"내 관점으로 말의 순위를 매겨 보는 페이지입니다. 거리 적성, 최근 폼, 말 승률, 기수 승률, 조교사 승률, 레이팅 중 중요하게 보는 항목의 열 제목을 누르면 그 기준으로 순위가 다시 매겨집니다. 마번은 출전표 그대로입니다.",sortHint:"열 제목을 누르면 그 항목으로 정렬됩니다. ▼ 표시가 현재 정렬 기준입니다.",sortModel:"",sortGate:"정렬: 마번 순",sortBy:e=>`정렬: ${e} (실제 값 기준)`,rankLegend:"표의 값은 실제 값입니다. 거리 적성: 오늘 거리 ±100m 경주의 평균 착순(낮을수록 좋음, 기록 없으면 '추정'). 최근 폼: 최근 5전 평균 착순과 착순 나열(최신 순). 말 승률: 통산 1착 비율. 기수·조교사: 제주 통산 승률. 레이팅: KRA 레이팅.",whyTitle:"어떻게 유력마를 고르나요?",whyBody:'<p><b>한 줄 요약.</b> 이것은 전문가의 예상이 아니라 통계입니다. 여기 나오는 모든 수치는 출전마의 경주 전 데이터를 2019년 이후 모든 제주 경주 결과와 대조해 계산한 것입니다. 사람이 말을 고르지 않으며, 배당도 보지 않습니다.</p>\n<p><b>무엇을 보나요?</b> 경주 전에 알 수 있는 26가지 정보를 봅니다. 크게 나누면 다섯 가지예요.<br>· <b>최근 실력</b>: 최근 경주에서 얼마나 빨리 뛰었나 (거리·주로 상태 보정)<br>· <b>막판 힘</b>: 마지막 600m를 얼마나 빨리 달렸나<br>· <b>사람</b>: 기수와 조교사가 요즘 얼마나 이기고 있나<br>· <b>컨디션</b>: 얼마 만에 나오는지, 최근 2주·한 달 훈련량<br>· <b>조건</b>: 게이트, 이 거리에서의 성적, 부담중량, 등급 이동, 레이팅, 나이</p>\n<p><b>계산 방법</b><br><b>① 항목 값 구하기.</b> 출전마마다 경주 전에 알 수 있는 26가지 값을 계산합니다. 예를 들면 직전 경주 스피드 지수, 최근 3전 마지막 600m 속도, 기수 승률, 쉰 기간, 게이트 번호 같은 것들이에요.<br>\n<b>② 경주 안에서 비교하기.</b> 각 값을 "오늘 이 경주 출전마 평균보다 얼마나 좋은가"로 바꿉니다. 평균이면 0, 평균보다 좋으면 +, 나쁘면 −예요. 경주마다 출전마 수준이 다르기 때문에 절대값이 아니라 그 경주 안의 상대 위치를 봅니다. 기록이 없는 항목(신마 등)은 0, 즉 평균으로 둡니다.<br>\n<b>③ 가중치를 곱해 점수 내기.</b> 항목마다 "실제로 우승과 얼마나 관련이 있었는가"를 나타내는 가중치가 있습니다. 2019년부터의 제주 경주 결과를 보고, 실제 우승마에게 가장 높은 확률을 주도록 컴퓨터가 정한 값이에요. ②의 값에 가중치를 곱해 모두 더하면 그 말의 점수가 됩니다. 가중치가 큰 항목은 기수 승률, 직전 경주 스피드 지수, 마지막 600m 속도, 휴양 후 복귀 여부, 게이트 번호예요(안쪽 게이트가 유리).<br>\n<b>④ 점수를 확률로 바꾸기.</b> 점수 차이를 우승 확률로 바꾸되, 경주 전체 합이 100%가 되게 합니다. 점수가 1점 높으면 우승 가능성이 약 2.7배가 되는 방식이에요. 예) 세 마리 점수가 1.0, 0.5, 0이면 우승 확률은 약 51%, 31%, 18%.<br>\n<b>⑤ 순위와 설명.</b> 확률이 높은 순서대로 순위를 매기고, 상위 4두를 \'누가 앞서 보이나\'에 올립니다. 말별 설명의 장점은 ③에서 점수를 가장 많이 올린 항목, 약점은 가장 많이 깎은 항목이에요.</p>\n<p><b>알아둘 점.</b> 확률은 그 경주 안에서만 의미가 있어서, 1R의 30%와 7R의 30%는 같은 뜻이 아닙니다. 공공데이터로 계산한 통계적 추정치이며, 예측이나 팁, 전문가 조언이 아닙니다.</p>',paceTitle:"전개 (구간 통과 순위)",finish:"결승",others:"4착 이하",paceNote:"S1F는 출발 후 첫 200m 지점, 2C~4C는 코너 통과, G1F는 결승 200m 전 순위입니다. 선에 마우스를 올리면 말별 통과 순위가 나옵니다. 결승선 옆 @는 단승 배당입니다.",styleTitle:"주행 스타일",styles:{front:"선행",stalk:"선입",mid:"중단",closer:"추입",none:"기록 없음"},styleDesc:{front:"S1F·첫 코너에서 선두권, 4C까지 앞자리를 지키는 말",stalk:"초반 선두 바로 뒤(상위 45% 안)에서 따라가는 말",mid:"초반 중위권, 또는 뒤에서 4C까지 중위권으로 전진하는 말",closer:"초반 후미(하위 25%)에서 4C까지도 뒤에 있다가 직선에서 추입하는 말",none:"구간 통과 순위 기록이 아직 없는 말(신마 등)"},styleHow:"포지션은 최근 경주들의 S1F(출발 직후)와 첫 코너(2C, 없으면 3C) 통과 순위를 출전 두수로 나눠 평균한 값입니다. 상위 15% 선행, 40%까지 선입, 70%까지 중단, 그 뒤는 추입.",byStyle:"포지션별",byGate:"마번순",styleCol:"포지션",styleBasis:e=>`최근 ${e}전 · S1F와 첫 코너 통과 순위 평균`,lead:"선두",back:"후미",earlyAvg:"초반 평균",earlyPos:"S1F 통과 순위",finishPos:"결승 착순",loadedTrial:e=>`주행심사 기록 ${e}건을 불러왔습니다.`,loadedWork:e=>`조교 기록 ${e}건을 불러왔습니다.`,styleNote:"각 선은 한 경주입니다. 왼쪽 점이 초반(S1F) 위치, 오른쪽 점이 결승 착순이며 경주 내 순위를 0(선두)~100(후미)으로 바꾼 값입니다.",loadedPace:e=>`구간 기록 ${e}건을 불러왔습니다.`,others2:"2착 이하",gateColors:"색 = 마번",ring:"테두리",trackName:"렛츠런파크 제주 · 1,610m",orderAt:"지점 통과 순서",play:"▶ 재생",pause:"■ 정지",paceLines:"선 그래프로 보기",trackNote:"시계 방향으로 달립니다. 각 말을 그 지점 통과 순위대로 앞뒤로 늘어세운 모습이며, 점의 색은 마번(안장 번호판) 색이고, 빨간 점에 노란 테두리가 최종 1착입니다. 지점 버튼을 누르거나 재생하면 말들이 이동합니다. 간격은 실제 거리 차가 아니라 순위입니다.",avgLbl:"제주 평균",dHorse:"말",dJockey:"기수",dTrainer:"조교사",saddle:"마번",chForm:"최근 10전 착순",chField:"오늘 출전마 중 위치",chStats:"통산 성적",pedigree:"혈통",lgField:"출전 두수",noForm:"최근 한 달 안에 뛴 경주가 없습니다.",fieldNote2:"가는 선은 같은 경주 다른 말들의 값, 굵은 막대는 이 말의 값입니다. # 는 경주 내 순위입니다.",mWin:"통산 승률",top3:"복삼승률",lastRun:"마지막 출전",last30:"최근 30일 (제주)",rides:"출전",wins:"1착",careerWin:"통산 승률 기준",newestFirst:"← 최근",noRecent:"최근 30일 출전 기록이 없습니다.",noStats:"통산 성적 데이터가 없습니다.",chRankJ:"제주 기수 통산 승률 순위 (100전 이상)",chRankT:"제주 조교사 통산 승률 순위 (100두 이상)",chOutcome:"통산 결과 구성",o1:"1착",o2:"2착",o3:"3착",oOther:"4착 이하",todayRides:"이 경주일 출전",openCharts:"이름을 누르면 그래프",resTitle:"경주 결과",resLede:"최근 한 달간 제주 경주 결과입니다. 다가오는 레이스카드에 나오는 말에는 '레이스카드 출전' 표시가 붙고, 이 결과로 레이스카드의 '최근 5전'을 계산합니다.",trial:"주행심사",raceDay:"경주",goingWord:  레이팅 조건 밖이라 실제 출전 여부는 별도 확인이 필요합니다.",won:"원",man:e=>e>=1e8?`${(e/1e8).toFixed(2)}억`:e>=1e4?`${Math.round(e/1e4).toLocaleString("ko-KR")}만`:String(e),loadedReg:e=>`출전등록마 ${e}두를 불러왔습니다.`,loadedRun:e=>`출전마 ${e}두를 불러왔습니다.`,loadedRes:e=>`경주 결과 ${e}건을 불러왔습니다.`},en:{eyebrow:"Jeju Racecourse · Race Card",title:e=>`${MONTHS[e.m-1]} ${e.d}, ${e.y} (${DOW[e.dw]})`,races:"Races",day:"Meeting",dayN:e=>`Day ${e}`,going:"Going",weather:"Weather",post:"Post time",planned:e=>`Scheduled ${e}`,runners:e=>`${e} runners`,open:"Standard race",distance:"Distance",cond:"Entry conditions",prize:"Prize money",total:"Total, 1st–5th",age:"Age",gender:"Sex",weight:"Weights",rating:"Rating",won:"KRW",gloss:"Glossary",load:"Load another race day",loadhelp:"Switch race days with the date buttons above. Open a bundle file made by the collector script (jeju_collect.py) to load everything at once. You can also paste single responses: JSON from the Jeju race info (API312), entries (API324) runners (API315) results (jejuhorseresult) API, or the horse-info (API42_1) jockey-stats (jktresult) and trainer-stats (trtresult) APIs (XML), one at a time; the page detects which. Load all three for the same race_dt to link them.",loadBtn:"Load",resetBtn:"Back to sample",loaded:e=>`Loaded ${e} races.`,err:"No race data found. Check that the JSON contains response.body.items.item.",empty:"No races on this date (totalCount 0). Try a Jeju race day, usually a Friday or Saturday.",sample:"Sample: real API response for 17 Aug 2024",lede:(e,n)=>`${e.ptinNhr} runners over ${e.raceDs}m in a ${n} race. ${weightLine(e,"en")}`,memorial:"Kim Man-il (1550–1632) was a Joseon-era Jeju horse breeder who presented thousands of horses to the state and was honored as a 'Horse-Giving Meritorious Subject.' The race carries his name as a symbol of Jeju's horse culture.",fiveOnly:"Scale: Jeju race distances, 800–1,800m",trLine:e=>`${e.n.toLocaleString("en-US")} career runners, ${e.w} wins · win ${e.wr}% · top-2 ${e.qr}%`,combo:(e,n,r,a)=>`Jockey ${e} (${n.wr}%) with trainer ${r} (${a.wr}%): ${n.wr>=14&&a.wr>=14?"both are among Jeju's top performers.":n.wr>=14||a.wr>=14?"one of the pair ranks among Jeju's best.":"both sit around the Jeju average."}`,loadedTr:e=>`Loaded stats for ${e} trainers.`,jkLine:e=>`${e.n.toLocaleString("en-US")} career rides, ${e.w} wins · win ${e.wr}% · top-2 ${e.qr}%`,jkNote:"The % beside each jockey is their Jeju career win rate (14%+ highlighted).",loadedJk:e=>`Loaded stats for ${e} jockeys.`,born:"Foaled",debut:"Debut",sire:"Sire",dam:"Dam",damsire:"damsire",career:"Career",winPct:"Win rate",top2:"Top-2",avgWin:"Avg. winning distance",hasInfo:"Profile",infoHint:"Tap a horse tagged 'Profile' to open its pedigree and career record. Paste horse-info API responses (XML) below to add more horses; their official English names then appear throughout.",infoSrc:"Source: KRA horse information API (API42_1)",loadedInfo:e=>`Loaded ${e} horse profiles.`,fileBtn:"Open file",bundleNames:{work:"workouts",trial:"trials",pace:"sectionals",sheet:"entry sheet",races:"races",reg:"entries",runs:"runners",results:"results",jockeys:"jockeys",trainers:"trainers",horses:"horse profiles"},loadedBundle:(e,n)=>`Loaded bundle for ${e}: ${n}`,tba:"TBA",srcSheet:"From the entry sheet API (API26_2)",archive:"sample",prizeCond:"Earnings limit",prizeWhy:"Races are graded by career prize money; only horses under this figure may enter.",wEqual:"All runners carry the same weight",finished:"Actual finish",fromSheet:"From the entry sheet",vetNA:"The entry sheet API has no vet or gear records. Load the runner API (API315) on race day to see them.",loadedSheet:(e,n)=>`Loaded ${e} runners from the entry sheet (${n}).`,loadedSheetN:e=>`Loaded ${e} runners from the entry sheet.`,rankTab:"Rank your own",modelP:"Model win %",fnames:{dist:"Distance",form:"Form",hwin:"Horse win",jock:"Jockey win",trn:"Trainer win",ratg:"Rating"},rankNote:"This is a page to rank the horses from your own point of view. Choose the factor that matters most to you (distance, recent form, horse win, jockey win, trainer win or rating) and tap its column header to rank the field accordingly. Gate numbers stay as on the entry sheet.",sortHint:"Tap any column header to sort by it. ▼ marks the current sort.",sortModel:"",sortGate:"Sorted by: gate number",sortBy:e=>`Sorted by: ${e} (actual values)`,rankLegend:"Table shows actual values. Distance fit: average finish in races within ±100m of today's trip (lower is better; 'est.' when none on file). Recent form: average finish over the last 5 and the finishes themselves (latest first). Horse win %: career wins ÷ starts. Jockey/trainer: Jeju career win rate. Rating: KRA rating.",whyTitle:"How do we choose the best horses?",whyBody:"<p><b>In one line.</b> This is statistics, not a tipster's opinion. Every number here is calculated by matching each runner's pre-race data against the results of every Jeju race since 2019. No expert picks the horses, and we never look at the odds.</p>\n<p><b>What it looks at.</b> 26 things known before the race, in five groups:<br>· <b>Recent ability</b>: how fast the horse ran lately (adjusted for distance and going)<br>· <b>Finishing speed</b>: how quick it was over the last 600 m<br>· <b>People</b>: how often the jockey and trainer are winning right now<br>· <b>Freshness</b>: days since its last run, and training load over the past two weeks and month<br>· <b>Conditions</b>: draw, record at this distance, weight carried, class change, rating, age</p>\n<p><b>How it's calculated</b><br><b>① Measure each factor.</b> For every runner we work out 26 values known before the race, such as the last-start speed figure, finishing speed over the last 600 m in its last three runs, the jockey's strike rate, days since the last run, and the draw.<br>\n<b>② Compare within the race.</b> Each value becomes \"how much better or worse than today's field average\": 0 is average, plus is better, minus is worse. Fields differ in quality, so we use a horse's place within this race, not raw numbers. A missing value (a debutant, say) is set to 0, the average.<br>\n<b>③ Weight and add up.</b> Each factor has a weight for how strongly it has been linked to winning. The weights were fitted by computer on Jeju results since 2019, choosing the values that give the actual winners the highest chances. Multiply each value from ② by its weight and add them up to get the horse's score. The heaviest weights go to the jockey's strike rate, the last-start speed figure, finishing speed over 600 m, returning from a break, and the draw (inside gates help).<br>\n<b>④ Turn scores into win chances.</b> Score gaps become win chances that add up to 100% across the race. One extra point of score makes a horse about 2.7 times as likely to win. Example: three horses scoring 1.0, 0.5 and 0 get roughly 51%, 31% and 18%.<br>\n<b>⑤ Rank and explain.</b> Horses are ranked by win chance, and the top four go under \"Who looks best\". In each horse's note, strengths are the factors that added most to its score in ③, and weaknesses are the ones that took most away.</p>\n<p><b>Keep in mind.</b> A win chance only means something within its own race: 30% in Race 1 is not the same as 30% in Race 7. These are statistical estimates from public data, not predictions, tips or professional advice.</p>",paceTitle:"Pace (position at each call)",finish:"Finish",others:"4th or worse",paceNote:"S1F is 200m after the start, 2C–4C are the turns, G1F is 200m from home. Hover a line for that horse's calls. @ beside the finish is the win dividend (SP).",styleTitle:"Running style",styles:{front:"Front runner",stalk:"On pace",mid:"Stalker",closer:"Closer",none:"No data"},styleDesc:{front:"In the first group at S1F and the first corner, and still in front at the 4C",stalk:"Sits just behind the leaders early (top 45%)",mid:"Midfield early, or comes from the back into midfield by the 4C",closer:"Rear early (bottom 25%) and still behind at the 4C, finishing in the straight",none:"No sectional records yet (e.g. debutants)"},styleHow:"Position is the average of each recent run's S1F (just after the start) and first-corner (2C, or 3C if none) placings, scaled by field size. Top 15% = front runner, to 40% on pace, to 70% stalker, beyond that closer.",byStyle:"By position",byGate:"By gate",styleCol:"Position",styleBasis:e=>`last ${e} runs · average of S1F and first-corner positions`,lead:"Lead",back:"Rear",earlyAvg:"Early avg",earlyPos:"Position at S1F",finishPos:"Finish",loadedTrial:e=>`Loaded ${e} qualifying-trial records.`,loadedWork:e=>`Loaded ${e} workout records.`,styleNote:"Each line is one run: the left dot is the early (S1F) position, the right dot the finish, both scaled 0 (lead) to 100 (rear) within the field.",loadedPace:e=>`Loaded ${e} sectional rows.`,others2:"2nd or worse",gateColors:"colour = gate",ring:"ring",trackName:"LetsRun Park Jeju · 1,610m",orderAt:"order at this call",play:"▶ Play",pause:"■ Stop",paceLines:"Show as line chart",trackNote:"Racing is clockwise. Horses are strung out in their order at that call; dot colours are the saddlecloth colours for each gate; the red dot with a yellow ring is the eventual winner. Tap a call or press play to move them. Gaps show order, not real distance.",avgLbl:"Jeju average",dHorse:"Horse",dJockey:"Jockey",dTrainer:"Trainer",saddle:"no.",chForm:"Last 10 finishes",chField:"Standing in today's field",chStats:"Career",pedigree:"Pedigree",lgField:"field size",noForm:"No runs in the past month.",fieldNote2:"Thin lines are the other runners in this race; the solid bar is this horse. # is its rank in the field.",mWin:"Career win %",top3:"Top-3",lastRun:"Last run",last30:"Last 30 days (Jeju)",rides:"rides",wins:"Wins",careerWin:"career win rate",newestFirst:"← newest",noRecent:"No rides in the last 30 days.",noStats:"No career data.",chRankJ:"Jeju jockeys by career win rate (100+ rides)",chRankT:"Jeju trainers by career win rate (100+ runners)",chOutcome:"Career outcomes",o1:"1st",o2:"2nd",o3:"3rd",oOther:"4th or worse",todayRides:"Runners this race day",openCharts:"tap a name for charts",resTitle:"Results",resLede:"Jeju results from the past month. Horses on the upcoming race card are tagged, and these results feed the card's Last 5 column.",trial:"Trial",raceDay:"Races",goingWord:"Going",winTime:"Winning time",inCard:"On race card",rcols:["Pos","No","Horse","Jockey","Wt","Body wt","Rating","Time","Behind","Margin","SP"],trialNote:"A trial checks that a horse is fit to race, before its debut or after a long break. There is no prize money and no official margins, only times.",resNote:(e,n)=>`A ${e.dist}m ${tr(e.budam).toLowerCase()} race. ${n?`${dname(n.hrnm,n.hrNo)} won in ${n.time} under ${pname(n.jck)}.`:""} Margins are to the horse directly ahead; one length is about one horse's body length (2.4m).`,recentTitle:"Recent results",field:"Field",fcols:["No.","Horse","Sex · age","Weight","Jockey / trainer","Rating","Last 5","Career","Earnings","Vet"],fieldNote:(e,n,r)=>`Weights run from ${n}kg to ${e}kg. ${r?"In a handicap, the heaviest weights go to the horses the handicapper rates highest.":"Weights here follow fixed rules for age, sex and earnings."} Last 5 reads newest first. On past race days, the actual finish appears beside each name. Records read starts: wins-seconds-thirds. Tap a row to open the horse's profile. The % beside each jockey and trainer is their Jeju career win rate.`,vetFlag:"Recent vet",pWeight:"Weight carried",wRank:(e,n)=>`#${e} heaviest of ${n}`,pJockey:"Jockey",recAllL:"Career record",rec1yL:"Last 12 months",fromEntries:"From entry data",vetTitle:"Recent vet records",vetNone:"No recent vet records.",equipLine:(e,n)=>`Equipment: ${e.length?e.join(", "):"none"} · Recent bleeding: ${n.length?n.join(", "):"none"}`,runText:(e,n,r,a,t)=>`Ridden by ${pname(e.jck)} from saddle no. ${e.no}, carrying ${e.wgt}kg${n?`, the #${n} heaviest of ${r}`:", the same weight as every runner"}.${t?n<=3?` The handicapper rates ${heShe(e.gndr)  a 1,610 m sand track and the only place in Korea that races the native pony. In 2026 it races about 100 days and 703 races from 2 Jan to 25 Dec, and every race is broadcast. Meetings are normally Friday and Saturday, plus three Monday public holidays (2 Mar, 17 Aug, 5 Oct)."],s:"2026 Jeju Racing Plan, pp.4–6",f:["horses","calendar","compare"]},{k:"horses",g:"basics",q:["어떤 말이 달리나요?","What kind of horses race?"],t:["경주마: 제주마","The horses: Jeju ponies"],b:["제주경마에서 뛰는 말은 천연기념물 제주마입니다. 서울·부경의 더러브렛보다 체구가 작아서 경주 기록 수준도 다릅니다. 이 페이지의 품종 표시는 한국마사회 마필 정보에서 가져옵니다.","Horses in Jeju races are the native Jeju pony, a designated natural monument. They are smaller than the Thoroughbreds raced in Seoul and Busan, so race times run at a different level. The breed label on this site comes from KRA's horse data."],s:"KRA horse data (breed code)",f:["pony","class","distance","welfare"]},{k:"pony",g:"basics",q:["제주마는 어떤 말이고 혈통은 어떻게 관리하나요?","What is the Jeju pony and how is its bloodline kept?"],t:["제주마: 기원과 혈통 관리","The Jeju pony: origins and bloodline"],b:["제주마 혈통은 한마디로 <b>13세기 몽골말 계통의 토종 조랑말을 순수하게 보존하려고 엄격하게 등록·관리하는 혈통</b>입니다.<br><br><b>기원</b><br>제주에는 청동기 시대 이전부터 말을 길렀던 흔적이 있습니다. 지금 제주마와 가까운 계통은 13세기 원(몽골)이 들여온 말에서 이어진 것으로 알려져 있습니다. 1276년 몽골 말 160마리를 수산평에 풀어 기른 것이 본격적인 시작이고, 고려 말~조선 초에는 약 2만 마리까지 늘었습니다. 과하마, 토마라고도 부릅니다.<br><br><b>천연기념물 지정</b><br>1986년 천연기념물 제347호로 지정됐습니다. 당시 혈통이 확인된 순종은 64마리뿐이었고, 전체 사육두수는 1,347마리였습니다. 체구는 작아서 체고가 암컷 약 117cm, 수컷 약 115cm입니다.<br><br><b>혈통 관리 방식</b><br>2000년 '제주마 등록관리 규정'을 만들고 2002년부터 등록을 시작했습니다. 등록은 두 종류입니다.<br>· <b>혈통등록마</b>: 부모가 둘 다 등록된 제주마인 말<br>· <b>기초등록마</b>: 조상 혈통은 불분명하지만 외모 심사와 DNA 검사(17개 유전자)로 제주마임이 확인된 말<br>등록된 말은 전자칩을 심어 이력을 관리하고, 부모는 유전자 분석으로 친자관계까지 확인합니다. 이 혈통등록과 관리는 한국마사회가 체계적으로 해 오고 있습니다. 현재 등록 제주마는 약 5,282마리이고, 이 중 씨수말로 지정된 말은 97마리 수준입니다(2026년 10월 기사 기준).<br><br><b>왜 중요한가</b><br>제주마가 경주마로 뛰는 곳은 제주경마공원뿐이고, 한국에서 유일한 토종 조랑말 경주입니다. 경마가 있기에 제주마가 길러지고 등록되고 혈통이 이어지므로, 제주경마는 천연기념물을 지키는 보존·증식의 토대이기도 합니다.","In a phrase, the Jeju pony bloodline is <b>a native pony line descended from 13th-century Mongol horses, strictly registered and managed to keep it pure</b>.<br><br><b>Origins</b><br>Horses were kept on Jeju before the Bronze Age. The line closest to today's Jeju pony is traced to horses brought by the Yuan (Mongol) rulers in the 13th century. In 1276, 160 Mongol horses were released at Susanpyeong, the real start of large-scale breeding, and by the late Goryeo to early Joseon period numbers grew to about 20,000. The pony is also called gwahama or toma.<br><br><b>Natural monument</b><br>It was designated Natural Monument No. 347 in 1986. At the time only 64 purebreds with confirmed pedigrees existed, out of 1,347 horses in total. It is small: about 117 cm at the withers for mares and about 115 cm for stallions.<br><br><b>How the bloodline is managed</b><br>Rules on registering Jeju ponies were set in 2000 and registration began in 2002. There are two kinds:<br>· <b>Pedigree-registered</b>: both parents are registered Jeju ponies<br>· <b>Foundation-registered</b>: ancestry is unclear, but appearance checks and DNA tests (17 genetic markers) confirm it is a Jeju pony<br>Registered horses get a microchip for their records, and parentage is checked by DNA. The Korea Racing Authority runs this registration and management systematically. There are about 5,282 registered Jeju ponies, of which about 97 are designated sires (as reported in October 2026).<br><br><b>Why it matters</b><br>Jeju Racecourse is the only place where the Jeju pony races, and the only native-pony racing in Korea. Racing is what keeps the ponies bred, registered and their bloodlines alive, so Jeju racing is also the base on which a natural monument is preserved and multiplied."],s:"Wikipedia (Jeju pony); Seoul Shinmun, 1 Oct 2026",f:["horses","jeju","welfare"]},{k:"calendar",g:"basics",q:["2026년 경주는 언제 있나요?","When does Jeju race in 2026?"],t:["2026년 일정","The 2026 calendar"],b:["시즌은 1월 2일(금)~12월 25일(금)이고 12월 26일은 취소 경주를 보전하는 예비경마일입니다. 휴장은 설(2/20~22), 혹서기(7/31~8/2), 추석(9/25~27) 세 번입니다. 월별 경주 수는 1월 65 · 2월 46 · 3월 56 · 4월 56 · 5월 75 · 6월 60 · 7월 60 · 8월 65 · 9월 43 · 10월 77 · 11월 54 · 12월 46입니다. 8월 7일~9월 6일 5주간은 금·토 야간경마로 열렸습니다.","The season runs from Fri 2 Jan to Fri 25 Dec, with 26 Dec held as a reserve day for cancelled races. There are three breaks: Lunar New Year (20–22 Feb), midsummer (31 Jul–2 Aug) and Chuseok (25–27 Sep). Races by month: Jan 65 · Feb 46 · Mar 56 · Apr 56 · May 75 · Jun 60 · Jul 60 · Aug 65 · Sep 43 · Oct 77 · Nov 54 · Dec 46. For five weeks from 7 Aug to 6 Sep the Friday and Saturday meetings were run at night."],s:"2026 Jeju Racing Plan, pp.4–6",f:["times","big","weather"]},{k:"compare",g:"basics",q:["서울·부산 경마와 뭐가 다른가요?","How is it different from Seoul or Busan?"],t:["서울·부경과의 차이","Jeju vs Seoul and Busan"],b:["서울(101일, 1,045경주)과 부산경남(86일, 673경주)은 더러브렛 경마이고, 제주(100일, 703경주)는 조랑말 경마입니다. 영천은 9월 13일부터 12월 6일까지 12일, 72경주만 엽니다. 네 경마장 모두 전 경주를 중계·발매합니다. 제주는 경주 거리가 800~1610m로 짧고, 출전 두수가 7~10두로 적으며, 6등급 경주는 성별 관계없이 같은 55kg을 집니다.","Seoul (101 days, 1,045 races) and Busan-Gyeongnam (86 days, 673 races) race Thoroughbreds; Jeju (100 days, 703 races) races ponies. Yeongcheon holds just 12 days and 72 races from 13 Sep to 6 Dec. All four tracks broadcast and bet on every race. Jeju's distances are short (800–1610 m), fields are small (7 to 10 runners) and Class 6 races are run at level weights of 55 kg whatever the sex."],s:"2026 Jeju Racing Plan, p.4",f:["distance","fields","horses"]},{k:"whatsnew",g:"basics",q:["2026년에 바뀐 건 뭔가요?","What changed in 2026?"],t:["2026년 달라진 점","What's new in 2026"],b:["대상·특별경주 상금이 올랐습니다(JIBS배·KCTV배 6천만→7천만 원, 마주협회장배 8천만→9천만, 제주마사랑·레클리스 5천만→5,500만, 1등급 일반경주 4,300만→4,400만). 경주당 최저 편성 두수가 8두에서 7두로 줄었고, 주행심사 합격 기준은 1분 10.5초에서 1분 10.0초로 빨라졌습니다. 6등급 부담중량은 성별 관계없이 55kg(전에는 암말 54kg)이 됐고, 6등급 거리에 1000m가 추가됐습니다. 기승 30회 이하 기수의 제한 거리에 1610m가 더해졌습니다. 2027년부터는 6등급 출전이 4세 상반기까지, 최대 15회로 제한됩니다.","Stakes purses went up (JIBS and KCTV Cups ₩60M→70M, Owners' Association Cup ₩80M→90M, Jeju Love and Reckless ₩50M→55M, Class 1 standard races ₩43M→44M). The minimum field fell from 8 to 7, and the qualifying-trial standard tightened from 1:10.5 to 1:10.0. Class 6 now carries 55 kg for every sex (mares used to get 54 kg) and may be run at 1000 m as well as 800 and 900 m. Jockeys with 30 rides or fewer are now also barred from 1610 m. From 2027 a horse may run in Class 6 only until the first half of its four-year-old season and for at most 15 starts."],s:"2026 Jeju Racing Plan, pp.1–3",f:["class","trials","big"]},{k:"class",g:"card",q:["등급과 레이팅은 어떻게 되나요?","How do classes and ratings work?"],t:["등급과 레이팅","Classes and ratings"],b:["1~5등급은 레이팅 구간으로 나뉩니다: 1등급 R81 이상, 2등급 R61~80, 3등급 R41~60, 4등급 R21~40, 5등급 R1~20. 6등급은 아직 레이팅이 없는 말들의 입문 등급입니다(2026년: 4세 이하, 순위상금 수득액 700만 원 미만). 700만 원에 도달하면 레이팅(R1~20)을 받고 5등급으로 올라갑니다. 레이팅 1점은 부담중량 0.5kg이고, 레이팅 변동은 매주 경마 종료 후 한국마사회 경마정보 '경주마 프로필'에 공지됩니다.","Classes 1–5 are set by rating band: Class 1 is R81+, Class 2 R61–80, Class 3 R41–60, Class 4 R21–40, Class 5 R1–20. Class 6 is the entry level for horses with no rating yet (in 2026: four-year-olds and under with career prize money below ₩7M). On reaching ₩7M a horse is given a rating (R1–20) and moves up to Class 5. One rating point equals 0.5 kg of weight, and rating changes are published on KRA's racing-information site after each race week."],s:"2026 Jeju Racing Plan, pp.7, 11–13",f:["ratingmoves","weight","fields"]},{k:"ratingmoves",g:"card",q:["레이팅은 어떻게 오르내리나요?","How do ratings go up and down?"],t:["레이팅 조정 방식","How ratings move"],b:["핸디캡위원은 경주마다 '기준마'(성적이 꾸준한 말)를 정하고, 그보다 앞서 들어온 말의 레이팅을 올립니다. 기본은 1마신당 1점이고, 한 경주의 최대 인상폭은 우승마 +30, 2위 +15, 3위 이하 +8입니다. 기준마보다 뒤진 말은 1~4점(대부분 2점 이내) 내릴 수 있습니다. 주행 방해를 받았거나 출발이 늦었거나, 경주 후 마체 이상이 발견된 말, 금지약물이 검출된 말 등은 내리지 않습니다. 마주는 발표 다음 주 수요일 13시까지 이의신청을 할 수 있습니다.","After each race the handicappers pick a 'line horse', a runner with consistent form, and raise the ratings of those that finished ahead of it: roughly one point per length, capped at +30 for the winner, +15 for second and +8 for third or worse. Horses beaten by the line horse may be cut by 1 to 4 points (usually 2 or fewer). No cut is made for horses that were interfered with, started slowly, were found unsound after the race or tested positive. Owners may appeal until 13:00 on the Wednesday after publication."],s:"2026 Jeju Racing Plan, pp.12–14",f:["class","weight","sanctions"]},{k:"weight",g:"card",q:["부담중량은 어떻게 정해지나요?","How are weights set?"],t:["부담중량과 수습기수","Weights and apprentice riders"],b:["6등급은 별정A: 성별에 관계없이 55kg으로 같습니다. 나머지 등급은 핸디캡으로, 레이팅 차이를 중량으로 맞춥니다(1점=0.5kg, 최저 51kg, 2~5등급은 상한 60kg, 1등급은 상한 없음). 수습기수는 우승 횟수에 따라 감량을 받습니다: 10승 미만 4kg, 10~19승 3kg, 20~29승 2kg, 30~39승 1kg. 감량은 일반경주에만 적용되고 데뷔 후 5년까지입니다.","Class 6 uses set weights (Set A): every horse carries 55 kg regardless of sex. Other classes are handicaps, with rating differences turned into weight (1 point = 0.5 kg, minimum 51 kg, and a 60 kg cap in Classes 2–5; no cap in Class 1). Apprentice jockeys claim an allowance by number of wins: under 10 wins 4 kg, 10–19 wins 3 kg, 20–29 wins 2 kg, 30–39 wins 1 kg. The claim applies in standard races only and for five years from the jockey's debut."],s:"2026 Jeju Racing Plan, pp.8–11",f:["ageweight","class","jockeys"]},{k:"ageweight",g:"card",q:["마령중량이 뭔가요?","What is weight-for-age?"],t:["마령중량","Weight-for-age"],b:["나이와 시기에 따라 미리 정해진 중량입니다. 대상·특별경주 일부에만 쓰고, 2026년 8개 대상·특별경주는 모두 핸디캡이라 실제로는 거의 안 보입니다. 기준표(수·거세말): 900m 이하 2세 53~55kg, 3세 56~57kg, 4세 이상 57kg. 1200m 초과는 2세 50~53kg, 3세 54~55kg, 4세 이상 57kg. 연말로 갈수록 어린 말의 중량이 1kg씩 늘고, 암말은 1kg 감량합니다. 나이는 1월 1일 기준입니다.","A fixed scale by age and time of year. It is used only in some stakes, and since all eight 2026 stakes are handicaps you will rarely see it. The scale (colts and geldings): at 900 m or less two-year-olds carry 53–55 kg, three-year-olds 56–57 kg and older horses 57 kg; over 1200 m it is 50–53 kg, 54–55 kg and 57 kg. Younger horses carry a kilo more each quarter as the year goes on, and fillies and mares get 1 kg off. Ages count from 1 January."],s:"2026 Jeju Racing Plan, p.8",f:["weight","big"]},{k:"distance",g:"card",q:["경주 거리는 어떻게 되나요?","What distances are run?"],t:["경주거리","Distances"],b:["제주는 800 · 900 · 1000 · 1110 · 1200 · 1300 · 1400 · 1610m, 8가지 거리를 씁니다. 1610m는 주로 한 바퀴입니다. 2026년 6등급 경주는 800 · 900 · 1000m입니다. 기승 횟수 30회 이하의 기수는 1300 · 1400 · 1610m 경주에 탈 수 없습니다.","Jeju uses eight distances: 800, 900, 1000, 1110, 1200, 1300, 1400 and 1610 m; 1610 m is one full lap. Class 6 races in 2026 are run at 800, 900 or 1000 m. Jockeys with 30 rides or fewer are not allowed to ride at 1300, 1400 or 1610 m."],s:"2026 Jeju Racing Plan, pp.3, 8",f:["going","colors","fields"]},{k:"colors",g:"card",q:["안장번호 색은 무슨 뜻인가요?","What do the saddle-cloth colours mean?"],t:["마번 색과 등번호판","Cloth colours and number plates"],b:["기수 모자와 안장번호 색은 출발 번호(게이트)로 정해집니다: 1번 흰색, 2번 노랑, 3번 빨강, 4번 검정, 5번 파랑, 6번 초록, 7번 갈색, 8번 분홍, 9번 보라, 10번 하늘색. 11·12번은 12두 편성 대상경주에서만 나옵니다. 이 사이트의 번호 배지도 같은 색을 씁니다. 말이 다는 등번호판은 일반경주에서는 모자색과 같고, 대상경주는 빨강, 특별경주는 파랑입니다.","Cap and saddle-cloth colours follow the gate number: 1 white, 2 yellow, 3 red, 4 black, 5 blue, 6 green, 7 brown, 8 pink, 9 purple, 10 sky blue; 11 and 12 appear only in 12-runner stakes. The number badges on this site use the same colours. The number plate on the horse matches the cap colour in standard races, but is red in a stakes race and blue in a special race."],s:"2026 Jeju Racing Plan, pp.36, 59",f:["card","stakesrules"]},{k:"card",g:"card",q:["출전표는 언제, 어떻게 나오나요?","When and how is the race card made?"],t:["출전표는 이렇게 만들어집니다","How a race card is put together"],b:["연간 계획은 전년 12월, 월간 계획은 그 달 시작 2주 전후에 나옵니다. 핸디캡 중량은 일반경주는 전주 토요일, 대상·특별경주는 전주 목요일에 공표됩니다. 출전신청은 경주가 있는 주 수요일 10:00~11:00에 받고, 7두 미만이면 취소하거나 다시 신청받으며, 14두 이상이면 두 경주로 나눌 수 있습니다. 출전마가 확정되면 출발 번호를 추첨하고 기수를 정해 출전표를 공표합니다. 이 사이트는 매일 아침 그 출전표를 받아 레이스카드를 만듭니다.","The annual plan comes out the previous December and each monthly plan about two weeks before the month starts. Handicap weights are published on the Saturday of the week before for standard races and the Thursday before for stakes. Entries are taken on the Wednesday of race week, 10:00–11:00; a race with fewer than 7 runners is cancelled or re-opened, and one with 14 or more may be split in two. Once the field is confirmed, gates are drawn, jockeys named and the card published. This site collects that card every morning."],s:"2026 Jeju Racing Plan, pp.26–35",f:["fields","times","colors"]},{k:"fields",g:"card",q:["한 경주에 몇 마리가 나오나요?","How many runners are in a race?"],t:["출전 두수","Field sizes"],b:["보통 7~10두입니다. 2026년부터 최소 편성 두수가 8두에서 7두로 내려갔고, 최대는 10두(1300 · 1400m 대상경주도 10두), 1200 · 1610m 대상경주는 12두입니다. 당일 집합 마감까지 5두 미만이 모이면 그 경주는 취소됩니다. 출전마가 적은 만큼 한 마리의 출발 실수가 결과를 크게 바꿀 수 있습니다.","Usually 7 to 10. From 2026 the minimum field is 7 (down from 8); the maximum is 10, including 1300 m and 1400 m stakes, and 12 in 1200 m and 1610 m stakes. If fewer than five horses turn up by the deadline on the day, the race is cancelled. With fields this small one bad start can change a result."],s:"2026 Jeju Racing Plan, pp.3, 7, 16, 36",f:["card","compare"]},{k:"timeline",g:"raceday",q:["경주 당일은 어떻게 진행되나요?","What happens on race day?"],t:["경주 진행 타임라인","The race-day timeline"],b:["출발 180분 전: 전 출전마 혈액 채취·약물검사. 60분 전: 출전준비소 집합, 마체중 계량, 건강 점검, 개체 확인. 50분 전: 기수 전검량. 20~30분 전: 예시장 말예시, 마권 발매 시작. 10~15분 전: 경주로 입장, 결승선 앞 직선주로를 평보로 통과한 뒤 준비운동. 출발과 동시에 발매 종료. 출발 2~3분 후 착순 판정, 3~4분 후 1~6위 기수 후검량과 마체검사, 4~5분 후 경주 확정·환급. 경주 후 1~3위마와 심판 지정마는 뇨·혈액 약물검사를 받습니다.","180 minutes before the off every runner gives a blood sample for a drug test. At 60 minutes the horses gather at the pre-race barn, are weighed, health-checked and identified. At 50 minutes the jockeys weigh out. At 20–30 minutes the parade begins and betting opens. At 10–15 minutes the horses go onto the track, walk past the stands and warm up. Betting closes at the start. Placings are judged 2–3 minutes after the off, the first six jockeys weigh in and horses are vet-checked at 3–4 minutes, and the result is confirmed and paid out at 4–5 minutes. The first three and any horse the stewards name then give urine and blood for a post-race test."],s:"2026 Jeju Racing Plan, p.40",f:["times","going","drugtest"]},{k:"times",g:"raceday",q:["첫 경주는 몇 시인가요?","What time is the first race?"],t:["출발 시각","Start times"],b:["주간 경마는 금요일 첫 경주 10:50, 토·일·월요일 10:35이고 마지막 경주는 17:55입니다. 경주 간격은 대부분 25분, 서울·부경 경주와 겹치는 시간대는 30~40분입니다. 가을 야간경마(8월 7일~9월 6일) 때는 금요일 13:00~19:55, 토요일 12:30~19:55였습니다. 실제 출발 시각은 월간 계획으로 조금씩 바뀔 수 있고, 이 사이트의 레이스카드에 경주별 출발 시각이 나옵니다.","Day racing starts at 10:50 on Fridays and 10:35 on Saturdays, Sundays and Mondays, with the last race at 17:55. Races are usually 25 minutes apart, stretching to 30–40 minutes when they interleave with Seoul and Busan. During autumn night racing (7 Aug–6 Sep) Friday ran 13:00–19:55 and Saturday 12:30–19:55. Exact times can shift with the monthly plan; the race card on this site shows each race's post time."],s:"2026 Jeju Racing Plan, pp.5, 43–45",f:["calendar","timeline"]},{k:"going",g:"raceday",q:["주로 상태는 어떻게 읽나요?","How do I read the going?"],t:["주로 상태 · 함수율","Going and moisture"],b:["제주는 모래 주로라 '양호·불량' 대신 함수율(%)로 상태를 알립니다. 이 사이트는 건조(~5%), 양호(6~9%), 다습(10~14%), 포화(15~19%), 불량(20%~)으로 나눕니다. 물기가 많을수록 모래가 다져져서 기록이 빨라지는 경향이 있고, 마른 주로는 깊어서 느립니다. 레이스카드의 함수율은 경주 당일 발표 전까지 '발표 전'으로 표시됩니다.","Jeju is a sand track, so the going is reported as moisture content (%) rather than firm or soft. This site groups it as Dry (~5%), Good (6–9%), Moist (10–14%), Saturated (15–19%) and Sloppy (20%+). Wetter sand packs firmer and tends to run faster; a dry track is deep and slow. Until the day's reading is published the race card shows 'TBA'."],s:"KRA track reports",f:["weather","timeline"]},{k:"weather",g:"raceday",q:["날씨로 경주가 취소되기도 하나요?","Do races get cancelled for weather?"],t:["기상 취소","Weather cancellations"],b:["드물지만 있습니다. 1991년부터 2025년까지 176일, 723경주가 날씨로 취소됐고 대부분은 짙은 안개 때문이었습니다. 태풍 3회(2002 루사, 2004 민들레, 2007 나리), 강풍·낙뢰, 2022년 12월 폭설도 있었습니다. 봄·초여름에 집중돼서 3월(128경주)과 5월(111경주)이 가장 많습니다. 2025년에는 5일 7경주가 안개로 취소됐습니다. 취소된 경주는 12월 26일 예비경마일이나 이후 경마일에 추가 편성해 보전하고, 상금은 그대로입니다.","Rarely, but yes. From 1991 to 2025, 176 days and 723 races were lost to weather, almost all to dense fog. Typhoons stopped racing three times (Rusa 2002, Mindulle 2004, Nari 2007), and strong wind, lightning and a December 2022 snowfall once each. Spring and early summer are the risky months: March (128 races) and May (111) lead the count. In 2025 seven races on five days were lost to fog. Cancelled races are re-run on the 26 Dec reserve day or added to later cards, with the same prize money."],s:"2026 Jeju Racing Plan, pp.36–37, 56–57",f:["going","calendar"]},{k:"drugtest",g:"raceday",q:["약물검사는 하나요?","Is there drug testing?"],t:["약물검사와 폐출혈 규정","Drug testing and bleeding rules"],b:["전 출전마는 출발 3시간 전에 혈액 검사를 받고, 결과는 출발 30분 전까지 심판위원에게 통보됩니다. 경주 후에는 1~3위마와 심판 지정마가 뇨·혈액 검사를 받습니다. 금지약물이 검출된 말은 레이팅 조정에서 제외되고 제재를 받습니다. 경주 중 폐출혈이 생긴 말은 1회 출전정지 1개월, 2회 2개월, 3회 이상 3개월에 주행심사를 다시 받아야 하며, 2년 안에 3회 발생하면 경주마 등록이 취소됩니다.","Every runner gives a blood sample three hours before the race, and the results reach the stewards 30 minutes before the off. After the race the first three and any horse the stewards name give urine and blood. A positive test brings a penalty and the horse is left out of rating adjustments. A horse that bleeds (EIPH) in a race is stood down for one month the first time, two months the second and three months thereafter, and must re-qualify each time; three bleeds within two years end its racing career."],s:"2026 Jeju Racing Plan, pp.25, 40",f:["vet","welfare","sanctions"]},{k:"big",g:"stakes",q:["2026년 큰 경주는 어떤 게 있나요?","Which are the big races of 2026?"],t:["2026년 대상·특별경주","Stakes and special races, 2026"],b:["대상경주 6개, 특별경주 2개, 모두 핸디캡입니다. <b>3월 21일</b> JIBS배(제11회, 1610m, 오픈, 7천만 원, 12두) · <b>5월 23일</b> KCTV배(제21회, 1400m, 오픈, 7천만, 10두) · <b>7월 18일</b> 제주마사랑(특별, 1300m, 오픈, 5,500만, 10두) · <b>9월 19일</b> 농림축산식품부장관배(제6회, 1610m, 오픈, 1억, 12두) · <b>10월 17일</b> 제주특별자치도지사배(제36회, 1400m, 6세 이하, 1억 5천만, 10두)와 호국영웅 레클리스(특별, 1200m, 7세 이상, 5,500만, 12두) · <b>11월 14일</b> 마주협회장배(제35회, 1200m, 3세 이하, 9천만, 12두) · <b>11월 28일</b> 제주일마배(제34회, 1610m, 오픈, 1억, 12두). 금액은 1~5위 순위상금 합계이고 일정은 바뀔 수 있습니다.","Six stakes and two special races, all handicaps. <b>21 Mar</b> JIBS Cup (11th, 1610 m, open, ₩70M, 12 runners) · <b>23 May</b> KCTV Cup (21st, 1400 m, open, ₩70M, 10) · <b>18 Jul</b> Jeju Love (special, 1300 m, open, ₩55M, 10) · <b>19 Sep</b> Minister of Agriculture Cup (6th, 1610 m, open, ₩100M, 12) · <b>17 Oct</b> Jeju Governor's Cup (36th, 1400 m, six-year-olds and under, ₩150M, 10) and Hoguk Yeongung Reckless (special, 1200 m, seven-year-olds and over, ₩55M, 12) · <b>14 Nov</b> Owners' Association Cup (35th, 1200 m, three-year-olds and under, ₩90M, 12) · <b>28 Nov</b> Jeju Ilma Cup (34th, 1610 m, open, ₩100M, 12). Purses are the total for the first five places; dates can change."],s:"2026 Jeju Racing Plan, p.16",f:["stakesrules","prize","calendar"]},{k:"stakesrules",g:"stakes",q:["대상경주는 일반경주와 뭐가 다른가요?","How are stakes different from standard races?"],t:["대상·특별경주의 규칙","Stakes rules"],b:["대상경주는 등번호판이 빨강, 특별경주는 파랑입니다. 모두 핸디캡 중량이고, 1300 · 1400m는 최대 10두, 1200 · 1610m는 최대 12두입니다. 미승리마는 출전등록을 할 수 없습니다. 마주는 순위상금의 0.22%를 출전등록료로 내고, 그 돈은 부가상금이 되어 1~3위 마주에게 6:3:1로 돌아갑니다. 후원사가 있으면 경주 이름 앞에 후원사명이 붙습니다. 취소되면 전통을 잇기 위해 가능한 한 다른 날 보전합니다.","A stakes race uses red number plates and a special race blue. All are handicaps; fields are capped at 10 over 1300 and 1400 m and 12 over 1200 and 1610 m. Maidens cannot enter. Owners pay an entry fee of 0.22% of the purse, which is returned as a bonus to the owners of the first three at 6:3:1. A sponsor's name may be added in front of the race name. If a stakes race is cancelled it is re-run on a later date wherever possible, to keep the tradition going."],s:"2026 Jeju Racing Plan, pp.15–16, 27, 36–37",f:["big","colors","prize"]},{k:"prize",g:"money",q:["상금은 얼마나 되나요?","How much is the prize money?"],t:["상금","Prize money"],b:["순위상금은 1위 50% · 2위 23% · 3위 15% · 4위 7% · 5위 5%로 나뉩니다. 1~5위 합계는 1등급 4,400만 원, 2등급 3,700만, 3등급 3,100만, 4등급 2,600만, 5등급 2,100만, 6등급 1,400만 원입니다(6등급 1위 700만 원). 순위상금은 마주 60.21%, 조교사(관리사 포함) 31.59%, 기수 8.20%로 나눕니다. 이와 별도로 출전만 해도 출전장려금(일반경주 마주 47만 원 · 조교사 13만 원, 대상경주 95만 · 30만)이 나오고, 기수는 기승료(일반경주 주간 10만 3천 원, 대상경주 35만 원)를 받습니다.","Purses are split 50% / 23% / 15% / 7% / 5% across the first five places. Total purse by class: Class 1 ₩44M, Class 2 ₩37M, Class 3 ₩31M, Class 4 ₩26M, Class 5 ₩21M, Class 6 ₩14M (so a Class 6 winner earns ₩7M). Winnings are shared 60.21% to the owner, 31.59% to the trainer (including grooms) and 8.20% to the jockey. On top of that every starter earns an appearance fee (standard race: ₩470,000 to the owner and ₩130,000 to the trainer; stakes: ₩950,000 and ₩300,000) and the jockey a riding fee (₩103,000 in a standard daytime race, ₩350,000 in a stakes race)."],s:"2026 Jeju Racing Plan, pp.18–19",f:["people","big","class"]},{k:"people",g:"money",q:["마주·조교사·기수는 어떤 관계인가요?","Who are the owner, trainer and jockey?"],t:["경마의 사람들","The people behind a runner"],b:["마주는 한국마사회에 등록해 말을 출전시키고 상금을 받습니다. 마주는 조교사와 위탁관리 계약을 맺어 관리비와 상금 일부를 주고, 조교사는 기수와 기승 계약을, 관리사와 고용 계약을 맺습니다. 그래서 순위상금이 마주 60.21%, 조교사 31.59%, 기수 8.20%로 흘러갑니다. 야간경마와 공휴일 경마에는 출전마 1두당 각각 35만 원·30만 원의 인센티브가 조교사와 관리사에게 더 지급됩니다.","The owner registers with the KRA, enters the horse and collects the prize money. The owner contracts a trainer to manage the horse, paying fees and a share of winnings; the trainer in turn contracts the jockeys and employs the grooms. That is why winnings flow 60.21% to the owner, 31.59% to the trainer and 8.20% to the jockey. Night and public-holiday meetings pay an extra ₩350,000 and ₩300,000 per runner to the trainer and grooms."],s:"2026 Jeju Racing Plan, pp.17–20",f:["prize","jockeys"]},{k:"jockeys",g:"money",q:["기수에게는 어떤 규칙이 있나요?","What rules apply to jockeys?"],t:["기수 규정","Jockey rules"],b:["수습기수는 우승 횟수에 따라 1~4kg 감량 혜택을 받고(일반경주, 데뷔 후 5년), 기승 30회 이하 기수는 1300 · 1400 · 1610m 경주에 탈 수 없습니다. 경주일 기승 기수는 자기 마지막 경주 다음 두 경주가 끝날 때까지 기수대기실에 머물러야 합니다. 경주 후에는 1~6위 기수와 심판이 지정한 기수가 후검량을 받습니다. 이 사이트의 기수 이름 옆 숫자는 통산 승률입니다.","Apprentices claim 1–4 kg by number of wins (standard races, for five years from debut), and jockeys with 30 rides or fewer may not ride at 1300, 1400 or 1610 m. On race day every rider must stay in the jockeys' room until two races after their last ride. After each race the first six jockeys, and any the stewards name, weigh in. The percentage next to a jockey's name on this site is their career strike rate."],s:"2026 Jeju Racing Plan, pp.3, 10, 38, 40",f:["weight","distance","timeline"]},{k:"trials",g:"welfare",q:["신마는 어떻게 경주에 나오나요?","How does a new horse get to the races?"],t:["경주마가 되기까지: 심사","Getting to the races: qualifying trials"],b:["신마는 출발심사와 800m 주행심사를 통과해야 경주에 나올 수 있습니다. 출발심사는 수·일요일 아침에 게이트 진입과 50m 이상 전력질주 2회로 봅니다. 주행심사는 목요일 10:00, 55kg으로 800m를 달려 1분 10.0초 안에 들어와야 합니다(2022년 1분 13.0초에서 해마다 당겨졌고, 2027년에는 900m로 바뀔 예정). 주행심사 합격일 또는 마지막 출전일부터 120일이 지난 말도 다시 심사를 받아야 합니다. 이 사이트는 말 프로필에 주행심사 기록을 보여줍니다.","A new horse must pass a barrier trial and an 800 m qualifying trial before it can race. Barrier trials are held on Wednesday and Sunday mornings: load into the gate and sprint 50 m twice. The qualifying trial is on Thursdays at 10:00, carrying 55 kg over 800 m, and the horse must beat 1:10.0 (the standard was 1:13.0 in 2022, has tightened every year, and moves to 900 m in 2027). A horse that has not raced or trialled for 120 days must re-qualify too. Trial records appear in each horse's profile on this site."],s:"2026 Jeju Racing Plan, pp.2, 21–23",f:["vet","sanctions","work"]},{k:"vet",g:"welfare",q:["출전 전에 건강검사를 하나요?","Are horses vet-checked before racing?"],t:["마체검사","Veterinary checks"],b:["네, 여러 번 합니다. 120일 이상 쉬었거나 수의위원이 지정한 말은 출전신청 전에 진료실에서 마체검사를 받아야 하고, 떨어지면 신청할 수 없습니다. 경주 당일에는 출발 3시간 전에 전 출전마가 경주 전 마체검사를 받고, 경주 직후에도 전 두수가 검사를 받습니다. 심판위원이 지정한 말은 따로 검사해 결과를 심판에게 알립니다. 검사에서 떨어진 말은 출전취소나 경주제외가 됩니다.","Yes, several times. A horse that has been off for 120 days or more, or one the vets have flagged, must pass a clinic check before it can even be entered. On race day every runner is examined three hours before the race and again straight after it. Horses named by the stewards get an extra check and the result goes to the stewards. A horse that fails is scratched."],s:"2026 Jeju Racing Plan, p.24",f:["drugtest","welfare","trials"]},{k:"welfare",g:"welfare",q:["말 복지는 어떻게 지켜지나요?","How is horse welfare protected?"],t:["말 복지 가이드라인","Horse welfare guidelines"],b:["한국마사회 말 복지 가이드라인(2017년 제정, 2025년 10월 3차 개정)은 동물의 5대 자유(배고픔·갈증, 불편함, 고통·상처·질병, 정상 행동 표현, 공포·스트레스로부터의 자유)를 기본 원칙으로 삼고, 상업적 이익보다 말의 건강을 우선하도록 합니다. 운동능력을 바꾸거나 이상을 감추는 약물은 금지되고, 치료나 휴식이 필요한 말은 출전시키지 않아야 합니다. 은퇴경주마 가이드라인(2021년 제정, 2025년 개정)은 마주가 은퇴 후 용도(승용·번식 등)를 미리 준비하고 말 등록기관에 신고하도록 하며, 한국마사회는 은퇴마 이력 데이터베이스와 재훈련 지원을 운영합니다.","KRA's Horse Welfare Guidelines (first issued 2017, third revision October 2025) are built on the five freedoms: from hunger and thirst, from discomfort, from pain, injury and disease, to express normal behaviour, and from fear and distress. They put the horse's health ahead of commercial interest, ban any drug that alters performance or masks a problem, and say a horse needing treatment or rest must not be raced. The Retired Racehorse Guidelines (2021, revised 2025) make owners plan a horse's second career, in riding or breeding for example, and report its retirement to the registry; the KRA keeps a database of retired horses and supports retraining."],s:"2026 Jeju Racing Plan, pp.46–53",f:["vet","drugtest","horses"]},{k:"sanctions",g:"welfare",q:["출발을 거부하는 말은 어떻게 되나요?","What happens to a horse that refuses to start?"],t:["악벽마와 능력부진마 제재","Bad habits and poor performers"],b:["게이트에서 3초 이상 고착하거나 반복해서 고착하면 출전정지 3개월에 출발심사 2회 연속 합격, 주행심사 2회 연속 합격이 필요합니다. 3초 미만이면 1~3개월입니다. 주행 중 멈추거나 반복적으로 주행을 거부해도 출전정지 3개월과 주행심사 2회입니다. 경주에서 53마신 이상 뒤지면 주행심사와 출전정지 1개월(두 번째는 2개월 이상), 40~53마신이면 주행심사를 받습니다. 800m 경주에서 1분 10.0초를 넘겨도 주행심사 대상입니다. 심판위원은 사례별로 달리 판단할 수 있습니다.","A horse that sticks in the gate for three seconds or more, or does so repeatedly, is stood down for three months and must then pass two barrier trials and two qualifying trials in a row; under three seconds it is one to three months. Stopping or repeatedly refusing to run brings three months and two trials. A horse beaten 53 lengths or more must re-qualify and is stood down for one month (two months or more the second time); 40 to 53 lengths means a trial. Running slower than 1:10.0 in an 800 m race also triggers a trial. The stewards may decide differently case by case."],s:"2026 Jeju Racing Plan, p.54",f:["trials","ratingmoves"]},{k:"work",g:"welfare",q:["조교 기록은 어떻게 읽나요?","How do I read the workout data?"],t:["조교(훈련) 기록 읽는 법","Reading the workout data"],b:["제주 경주마는 매일 새벽 경주로에서 조교를 받고, 기록에는 날짜, 훈련 시간(분), 누가 탔는지(기수·조교사·관리사)가 남습니다. 해외처럼 몇 m를 몇 초에 달렸는지는 공개되지 않아서, 평소보다 많이 또는 적게 탔는지, 이번에 탈 기수가 직접 조교에 올라탔는지를 봅니다. 출전 신청 전 2주간 5회 이상 조교는 의무라, 출전마는 기본 조교량은 채우고 나옵니다. 말 프로필의 '최근 조교' 막대와 스토리의 '주의할 점'에 나옵니다.","Jeju horses work on the track most mornings. The public record shows the date, minutes on the track and who rode (jockey, trainer or groom). Clockings over set distances are not published as they are abroad, so the useful signals are whether a horse did more or less than usual and whether today's jockey rode it in work. At least five workouts in the two weeks before entry are compulsory, so every runner meets a baseline. See the 'Recent workouts' bars in each horse's profile and the watch-outs in each race story."],s:"KRA daily workout data · 2026 Jeju Racing Plan, p.28",f:["trials","card"]}],GUIDE_TOUR=["horses","class","weight","colors","timeline","big"],PRIMER=GUIDE.map(e=>({k:e.k,t:e.t,b:e.b,s:e.s})),GLKEY={work:"work",class:"class",rating:"class",weight:"weight",apprentice:"weight",trial:"trials",breed:"horses",prize:"prize",distance:"distance",card:"card"};function primerHtml(e){const n=T[l
